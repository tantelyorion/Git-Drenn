[package]
name = "git-drenn"
version = "0.1.0"
edition = "2021"
description = "GIT DRENN - Git Powered by AI : un agent léger qui transforme des instructions en opérations Git vérifiées"
license = "MIT"

[[bin]]
name = "drenn"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
