# Lie le runtime C statiquement (MSVC) : drenn.exe fonctionne sur un Windows « vierge »,
# sans « Visual C++ Redistributable ». Sans effet sur les autres plateformes.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
